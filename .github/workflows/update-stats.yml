name: Update CP Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Check if should run
        id: random_check
        run: |
          if [ $((RANDOM % 4)) -eq 0 ]; then
            echo "run_it=true" >> $GITHUB_ENV
          else
            echo "run_it=false" >> $GITHUB_ENV
          fi

      - name: Fetch CP Stats
        if: env.run_it == 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/CP-stats/fetch_cp_stats.py

      - name: Update README
        if: env.run_it == 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/CP-stats/update_readme.py

      - name: Commit and Push Changes
        if: env.run_it == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/stats.json README.md
          git commit -m "Update CP Stats" || echo "No changes to commit"
          git push
